name: Deploy to VPS

# Runs after the site image is published, then tells the VPS to pull the new
# images and restart the stack. Also runnable by hand from the Actions tab.
on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull & restart on VPS
    runs-on: ubuntu-latest
    # Skip if the publish run failed (manual runs have no source run, so allow
    # those through too).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: SSH in and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            docker compose pull
            docker compose up -d
            docker image prune -f
